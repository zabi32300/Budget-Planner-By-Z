<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Planner By Z</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0f0f0f;color:white;overflow-x:hidden}
#welcome{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f0f0f;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;animation:hideWelcome 0.5s ease 3s forwards}
#welcome h1{font-size:3rem;color:#FFD700;animation:pop 0.8s ease infinite alternate;text-align:center}
#welcome p{color:#aaa;margin-top:10px;letter-spacing:3px}
@keyframes pop{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes hideWelcome{to{transform:translateY(-100%);opacity:0;visibility:hidden}}
.container{max-width:500px;margin:20px auto;padding:20px;animation:fadeIn 1s ease 3.2s both}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.header{background:#FFD700;color:#000;padding:20px;border-radius:15px;text-align:center;font-weight:bold;font-size:1.5rem;margin-bottom:20px}
.card{background:#1e1e1e;padding:20px;border-radius:15px;margin-bottom:15px;border:1px solid #333}
.card label{color:#FFD700;display:block;margin-bottom:8px;font-weight:600}
.card input{width:100%;padding:12px;border-radius:10px;border:none;background:#2a2a2a;color:white;font-size:16px;outline:none}
.expense-item{display:flex;gap:10px;margin-bottom:10px}
.expense-item input:first-child{flex:2}
.expense-item input:last-child{flex:1}
.btn{width:100%;padding:14px;background:#FFD700;color:#000;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px}
.btn-outline{background:transparent;border:2px solid #FFD700;color:#FFD700}
.result{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;padding:20px;border-radius:15px;margin-top:20px;display:none}
.bar{height:10px;background:rgba(0,0,0,0.2);border-radius:5px;margin:8px 0 15px 0;overflow:hidden}
.bar-fill{height:100%;background:#000;border-radius:5px;transition:width 1s ease}
</style>
</head>
<body>
<div id="welcome">
<h1>Budget Planner<br>By Z</h1>
<p>WELCOME</p>
</div>
<div class="container">
<div class="header">Z Budget Planner</div>
<div class="card">
<label>Total Income Rs</label>
<input type="number" id="income" placeholder="50000" oninput="calculate()">
</div>
<div class="card">
<label>Kharchay</label>
<div id="expenses">
<div class="expense-item"><input type="text" placeholder="Kiraya"><input type="number" placeholder="Raqam" oninput="calculate()"></div>
<div class="expense-item"><input type="text" placeholder="Rashan"><input type="number" placeholder="Raqam" oninput="calculate()"></div>
<div class="expense-item"><input type="text" placeholder="Bill"><input type="number" placeholder="Raqam" oninput="calculate()"></div>
</div>
<button class="btn btn-outline" onclick="addExpense()">+ Mazid Kharcha</button>
</div>
<button class="btn" onclick="calculate()">Budget Check Karo</button>
<div class="result" id="result">
<h3 id="resultText"></h3>
<div id="bars"></div>
<p id="savingText" style="font-weight:bold;margin-top:10px"></p>
</div>
</div>
<script>
function addExpense(){
const div=document.createElement('div');
div.className='expense-item';
div.innerHTML='<input type="text" placeholder="Kharcha"><input type="number" placeholder="Raqam" oninput="calculate()">';
document.getElementById('expenses').appendChild(div);
}
function calculate(){
let income=parseFloat(document.getElementById('income').value)||0;
let inputs=document.querySelectorAll('#expenses .expense-item');
let total=0; let html='';
inputs.forEach(item=>{
let name=item.children[0].value||'Kharcha';
let val=parseFloat(item.children[1].value)||0;
total+=val;
if(val>0){
let per=income>0?Math.round((val/income)*100):0;
html+=`<div style="display:flex;justify-content:space-between"><span>${name}</span><span>${per}%</span></div><div class="bar"><div class="bar-fill" style="width:${per}%"></div></div>`;
}
});
if(income>0){
document.getElementById('result').style.display='block';
let saving=income-total;
document.getElementById('resultText').innerText=`Kul Kharcha: Rs ${total} / Rs ${income}`;
document.getElementById('bars').innerHTML=html;
document.getElementById('savingText').innerText=saving>=0?`✅ Aap Rs ${saving} bacha rahay hain`:`❌ Aap Rs ${Math.abs(saving)} zyada kharch kar rahay hain`;
}
}
</script>
</body>
</html>
