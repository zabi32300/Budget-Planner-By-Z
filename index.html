<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Planner By Z - Made by Zohaib</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif}
body{background:#0f0f0f;color:white;overflow-x:hidden}
#welcome{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f0f0f;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;animation:hideW 0.6s ease 3s forwards}
#welcome h1{font-size:3rem;color:#FFD700;text-align:center;animation:pop 0.8s infinite alternate}
#welcome p{color:#FFD700;margin-top:12px;letter-spacing:2px;font-weight:bold}
@keyframes pop{from{transform:scale(1)}to{transform:scale(1.07)}}@keyframes hideW{to{transform:translateY(-100%);opacity:0;visibility:hidden}}
.container{max-width:560px;margin:15px auto;padding:15px}
.header{background:#FFD700;color:#000;padding:14px 18px;border-radius:15px;display:flex;justify-content:space-between;align-items:center;font-weight:bold}
.header span small{display:block;font-size:10px;font-weight:800;letter-spacing:1px}
.card{background:#1e1e1e;padding:18px;border-radius:15px;margin-bottom:12px;border:1px solid #333}
.card label{color:#FFD700;display:block;margin-bottom:6px;font-weight:600;font-size:14px}
.card input{width:100%;padding:11px;border-radius:10px;border:none;background:#2a2a2a;color:white;outline:none}
.expense-item{display:flex;gap:8px;margin-bottom:8px}
.btn{width:100%;padding:13px;background:#FFD700;color:#000;border:none;border-radius:12px;font-weight:bold;cursor:pointer;margin-top:8px}
.btn-outline{background:transparent;border:2px solid #FFD700;color:#FFD700}
.lang{cursor:pointer;background:#000;color:#FFD700;border:1px solid #FFD700;padding:6px 12px;border-radius:20px;font-size:11px}
.result{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;padding:18px;border-radius:15px;margin-top:15px;display:none}
.history{background:#1e1e1e;border-radius:15px;padding:15px;margin-top:15px}
.footer{text-align:center;margin-top:25px;padding:15px;color:#666;font-size:13px;border-top:1px solid #222}
.footer b{color:#FFD700}
canvas{background:#fff;border-radius:12px;padding:10px;margin-top:12px}
.made-badge{position:fixed;top:10px;right:10px;background:#FFD700;color:#000;font-size:10px;font-weight:900;padding:5px 10px;border-radius:20px;z-index:100;letter-spacing:1px}
</style>
</head>
<body>
<div class="made-badge">MADE BY ZOHAIB</div>
<div id="welcome"><h1>Budget Planner<br>By Z</h1><p>MADE BY ZOHAIB</p><span style="color:#666;font-size:12px;margin-top:8px">Pro Version Loading...</span></div>

<div class="container">
<div class="header">
<span>Z Budget Pro<small>MADE BY ZOHAIB</small></span>
<button class="lang" onclick="toggleLang()" id="langBtn">اردو / EN</button>
</div>

<div class="card">
<label id="l1">Total Income Rs</label>
<input type="number" id="income" placeholder="50000" oninput="calculate()">
</div>

<div class="card">
<label id="l2">Saving Goal (Bike, Mobile etc)</label>
<div style="display:flex;gap:8px">
<input type="text" id="goalName" placeholder="Goal Name">
<input type="number" id="goalAmount" placeholder="Amount" oninput="calculate()">
</div>
<p id="goalText" style="margin-top:8px;color:#FFD700;font-weight:bold"></p>
</div>

<div class="card">
<label id="l3">Kharchay</label>
<div id="expenses">
<div class="expense-item"><input type="text" placeholder="Kiraya" value="Kiraya"><input type="number" placeholder="Raqam" oninput="calculate()"></div>
<div class="expense-item"><input type="text" placeholder="Rashan" value="Rashan"><input type="number" placeholder="Raqam" oninput="calculate()"></div>
<div class="expense-item"><input type="text" placeholder="Bill" value="Bill"><input type="number" placeholder="Raqam" oninput="calculate()"></div>
</div>
<button class="btn btn-outline" onclick="addExpense()" id="l4">+ Mazid Kharcha</button>
</div>

<button class="btn" onclick="calculate()" id="l5">Budget Check Karo</button>
<button class="btn btn-outline" onclick="saveMonth()" id="l6">Month Save Karo</button>

<div class="result" id="result">
<h3 id="resultText"></h3>
<div id="bars" style="margin-top:10px;font-size:14px"></div>
<p id="savingText" style="font-weight:900;margin-top:12px;font-size:16px"></p>
<canvas id="myChart" height="220"></canvas>
<div style="display:flex;gap:8px;margin-top:12px">
<button class="btn" style="background:#000;color:#FFD700" onclick="downloadPDF()">PDF Download - Made By Zohaib</button>
</div>
</div>

<div class="history" id="history">
<h4 style="color:#FFD700" id="l7">Pichle Mahino Ka Hisab</h4>
<div id="historyList" style="margin-top:10px;font-size:14px;color:#aaa">Koi record nahi</div>
</div>

<div class="footer">Developed with ❤️ by <b>Zohaib</b> | Budget Planner By Z<br>© 2026 Made By Zohaib - All Rights Reserved</div>
</div>

<script>
let lang='en'; let chart;
let t={
en:{income:"Total Income Rs",goal:"Saving Goal",kharcha:"Expenses",add:"+ Add More",check:"Check Budget",save:"Save This Month",history:"Monthly History"},
ur:{income:"کل آمدنی",goal:"بچت کا ہدف",kharcha:"خرچے",add:"+ مزید خرچ",check:"بجٹ چیک کریں",save:"مہینہ محفوظ کریں",history:"پچھلے مہینوں کا حساب"}
};
function toggleLang(){
lang=lang==='en'?'ur':'en';
document.getElementById('l1').innerText=t[lang].income;
document.getElementById('l2').innerText=t[lang].goal;
document.getElementById('l3').innerText=t[lang].kharcha;
document.getElementById('l4').innerText=t[lang].add;
document.getElementById('l5').innerText=t[lang].check;
document.getElementById('l6').innerText=t[lang].save;
document.getElementById('l7').innerText=t[lang].history;
}
function addExpense(){
let d=document.createElement('div');d.className='expense-item';
d.innerHTML='<input type="text" placeholder="Kharcha"><input type="number" placeholder="Raqam" oninput="calculate()">';
document.getElementById('expenses').appendChild(d);
}
function calculate(){
let income=parseFloat(document.getElementById('income').value)||0;
let goalAmt=parseFloat(document.getElementById('goalAmount').value)||0;
let goalName=document.getElementById('goalName').value||'Goal';
let ex=document.querySelectorAll('#expenses .expense-item');
let total=0; let labels=[]; let data=[]; let bars='';
ex.forEach(i=>{
let n=i.children[0].value||'Kharcha'; let v=parseFloat(i.children[1].value)||0;
if(v>0){total+=v; labels.push(n); data.push(v);
let per=income?Math.round(v/income*100):0;
bars+=`<div style="display:flex;justify-content:space-between;border-bottom:1px dashed #00000022;padding:3px 0"><span>${n}</span><span>${per}%</span></div>`;
}
});
if(income>0){
document.getElementById('result').style.display='block';
let saving=income-total;
document.getElementById('resultText').innerText=`Kul Kharcha: Rs ${total} / Rs ${income}`;
document.getElementById('bars').innerHTML=bars;
document.getElementById('savingText').innerText=saving>=0?`Saving: Rs ${saving}`:`Over Budget: Rs ${Math.abs(saving)}`;
if(goalAmt>0 && saving>0){
let months=Math.ceil(goalAmt/saving);
document.getElementById('goalText').innerText=`${goalName} k liye ${months} mahine lagenge (Rs ${saving}/month)`;
}
drawChart(labels,data);
}
}
function drawChart(labels,data){
let ctx=document.getElementById('myChart').getContext('2d');
if(chart) chart.destroy();
chart=new Chart(ctx,{type:'pie',data:{labels:labels,datasets:[{data:data,backgroundColor:['#FFD700','#FF8C00','#FF6347','#40E0D0','#9370DB','#32CD32']}]},options:{plugins:{legend:{position:'bottom'}}}});
}
function saveMonth(){
let income=document.getElementById('income').value;
if(!income) return alert('Income likho!');
let hist=JSON.parse(localStorage.getItem('budgetHistory')||'[]');
hist.push({date:new Date().toLocaleDateString(),income:income,total:document.getElementById('resultText').innerText});
localStorage.setItem('budgetHistory',JSON.stringify(hist));
showHistory();
}
function showHistory(){
let hist=JSON.parse(localStorage.getItem('budgetHistory')||'[]');
let list=document.getElementById('historyList');
if(hist.length==0){list.innerHTML='Koi record nahi'; return;}
list.innerHTML=hist.map(h=>`<div style="border-bottom:1px solid #333;padding:6px 0">📅 ${h.date} - ${h.total}</div>`).join('');
}
function downloadPDF(){
const {jsPDF}=window.jspdf; let doc=new jsPDF();
doc.setFillColor(255,215,0); doc.rect(0,0,210,32,'F');
doc.setTextColor(0,0,0); doc.setFontSize(18); doc.setFont("helvetica","bold");
doc.text("Budget Planner By Z",12,14);
doc.setFontSize(10); doc.text("MADE BY ZOHAIB",12,22);
doc.setFontSize(9); doc.text("zabi32300.github.io/Budget-Planner-By-Z",12,27);
doc.setTextColor(0,0,0); doc.setFontSize(12); doc.setFont("helvetica","normal");
let y=45;
doc.setFont("helvetica","bold"); doc.text(`${document.getElementById('resultText').innerText}`,10,y); y+=10;
doc.text(`${document.getElementById('savingText').innerText}`,10,y); y+=10;
doc.setFont("helvetica","normal");
if(document.getElementById('goalName').value){
doc.text(`Goal: ${document.getElementById('goalName').value} - Rs ${document.getElementById('goalAmount').value}`,10,y); y+=8;
doc.text(`${document.getElementById('goalText').innerText}`,10,y); y+=12;
}
doc.text(`Date: ${new Date().toLocaleString()}`,10,y); y+=12;
doc.setFont("helvetica","bold"); doc.text("Kharchay Ki Tafseel:",10,y); y+=8;
doc.setFont("helvetica","normal");
document.querySelectorAll('#expenses .expense-item').forEach(item=>{
 let name=item.children[0].value||'Kharcha'; let amt=item.children[1].value||'0';
 if(parseFloat(amt)>0){ doc.text(`- ${name}: Rs ${amt}`,12,y); y+=7; }
});
y+=10; doc.setDrawColor(200); doc.line(10,y,200,y); y+=8;
doc.setFontSize(10); doc.setFont("helvetica","bold");
doc.text("Developed by Zohaib",10,y); y+=5;
doc.setFont("helvetica","normal"); doc.setFontSize(9);
doc.text("This report is generated by Budget Planner By Z - Made By Zohaib",10,y);
doc.setFontSize(8); doc.setTextColor(120); doc.text("© 2026 Made By Zohaib | All Rights Reserved",10,290);
doc.save("Budget-Planner-By-Z-Made-By-Zohaib.pdf");
}
showHistory();
</script>
</body>
</html>
